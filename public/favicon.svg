<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2952E3" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2952E3" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.25" />
  
  <!-- Bold "H" Logo Text -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="#FFFFFF" 
    font-family="'Nobile', 'Alexandria', 'Inter', system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="280"
    letter-spacing="-10"
  >H</text>
</svg>