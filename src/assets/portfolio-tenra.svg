<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tenraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#tenraBg)" />
  <circle cx="200" cy="150" r="180" fill="#818CF8" opacity="0.15" />
  <circle cx="650" cy="380" r="220" fill="#C084FC" opacity="0.12" />
  
  <!-- Stationery Mockup Elements -->
  <g filter="url(#shadow)">
    <!-- Notebook -->
    <rect x="240" y="120" width="220" height="280" rx="16" fill="#FFFFFF" />
    <rect x="240" y="120" width="30" height="280" rx="4" fill="#6366F1" />
    <line x1="290" y1="180" x2="420" y2="180" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
    <line x1="290" y1="210" x2="400" y2="210" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
    <line x1="290" y1="240" x2="430" y2="240" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round" />
    <circle cx="380" cy="320" r="24" fill="url(#accent)" />

    <!-- Pen / Pencil -->
    <rect x="490" y="140" width="18" height="240" rx="9" fill="#F43F5E" transform="rotate(-15 490 140)" />
    
    <!-- Card / Tablet preview -->
    <rect x="420" y="200" width="220" height="150" rx="12" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
    <rect x="440" y="230" width="80" height="12" rx="6" fill="url(#accent)" />
    <rect x="440" y="255" width="140" height="8" rx="4" fill="#475569" />
    <rect x="440" y="275" width="110" height="8" rx="4" fill="#334155" />
    <rect x="440" y="300" width="70" height="24" rx="12" fill="#6366F1" />
  </g>
  <text x="400" y="440" font-family="'Nobile', sans-serif" font-size="22" font-weight="bold" fill="#EEF2FF" text-anchor="middle" letter-spacing="2">TENRA STATIONERY</text>
</svg>
